<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primo Care - Staff</title>
<style>
  :root {
    color-scheme: light;
    --teal: #0e7c86;
    --teal-dark: #0a5c64;
    --teal-light: #e6f4f5;
    --ink: #1f2937;
    --muted: #6b7280;
    --border: #e2e8f0;
    --bg: #ffffff;
    --green: #16a34a;
    --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f7f9fa;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }

  header.brand {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 24px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    border-radius: 14px; color: white; margin-bottom: 22px;
  }
  header.brand .id { display: flex; align-items: center; gap: 12px; }
  header.brand .logo {
    width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  header.brand h1 { margin: 0; font-size: 20px; }
  header.brand p { margin: 2px 0 0; font-size: 13px; opacity: 0.9; }
  header.brand a.dash-link {
    background: rgba(255,255,255,0.16); color: #fff; text-decoration: none; font-weight: 700;
    font-size: 12.5px; padding: 8px 14px; border-radius: 8px; white-space: nowrap;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  header.brand a.dash-link:hover { background: rgba(255,255,255,0.28); transform: translateY(-2px); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .toolbar .count { font-size: 13px; color: var(--muted); }
  button.refresh {
    background: #fff; border: 1.5px solid var(--teal); color: var(--teal-dark); font-weight: 700;
    font-size: 12.5px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  button.refresh:hover { background: var(--teal-light); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }

  .job-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    transition: box-shadow 0.25s ease;
  }
  .job-card:hover { box-shadow: 0 8px 22px rgba(0,0,0,0.08); }
  @media (max-width: 560px) {
    .job-card { flex-direction: column; align-items: stretch; }
    .pay-controls { flex-direction: row; }
    .pay-controls select.method { flex: 1; }
    header.brand { flex-direction: column; align-items: flex-start; }
  }
  .job-card .info b { display: block; font-size: 15px; margin-bottom: 4px; }
  .job-card .info .line { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .job-card .info .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; padding: 2px 8px; border-radius: 999px; margin-top: 6px;
    background: var(--teal-light); color: var(--teal-dark);
  }
  .job-card .info .badge.ongoing { background: #fef3c7; color: #92400e; }
  .job-card .info .badge.unpaid { background: #ffedd5; color: #9a3412; }
  .job-card .info .amount { font-size: 14px; font-weight: 700; color: var(--teal-dark); margin-top: 4px; }
  button.complete {
    background: var(--green); color: #fff; border: none; border-radius: 8px;
    font-weight: 700; font-size: 13px; padding: 10px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(22,163,74,0.25);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  button.complete:hover { background: #15803d; transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 16px rgba(22,163,74,0.32); }
  button.complete:disabled { opacity: 0.6; cursor: default; }
  button.complete:disabled:hover { transform: none; box-shadow: 0 3px 8px rgba(22,163,74,0.25); }
  .pay-controls { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  select.method {
    border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; padding: 8px 10px;
    color: var(--ink); background: #fff; font-family: inherit;
  }
  button.pay {
    background: #d97706; color: #fff; border: none; border-radius: 8px;
    font-weight: 700; font-size: 13px; padding: 10px 16px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 3px 8px rgba(217,119,6,0.25);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  button.pay:hover { background: #b45309; transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 16px rgba(217,119,6,0.32); }
  button.pay:disabled { opacity: 0.6; cursor: default; }
  button.pay:disabled:hover { transform: none; box-shadow: 0 3px 8px rgba(217,119,6,0.25); }

  h2.section-title { font-size: 15px; color: var(--ink); margin: 30px 0 12px; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; }
  .error-box { background: #fef2f2; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 14px; }
  .toast { background: #ecfdf3; color: #166534; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="id">
      <div class="logo">&#10003;</div>
      <div>
        <h1>Primo Care &mdash; Staff</h1>
        <p>Mark completed jobs off the schedule, and mark payments once settled</p>
      </div>
    </div>
    <a class="dash-link" href="/staff/dashboard">Dashboard &rarr;</a>
  </header>

  <div id="errorBox"></div>
  <div id="toastBox"></div>

  <div class="toolbar">
    <span class="count" id="countLabel">Loading&hellip;</span>
    <button class="refresh" id="refreshBtn">Refresh</button>
  </div>

  <div id="jobList"></div>

  <h2 class="section-title">Awaiting Payment</h2>
  <div id="unpaidList"></div>
</div>

<script>
function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderJobs(jobs) {
  var list = $('jobList');
  if (!jobs.length) {
    list.innerHTML = '<div class="empty">No scheduled or ongoing jobs right now.</div>';
    $('countLabel').textContent = '0 jobs';
    return;
  }
  $('countLabel').textContent = jobs.length + ' job' + (jobs.length === 1 ? '' : 's');
  list.innerHTML = jobs.map(function (j) {
    var badgeClass = j.status === 'Ongoing' ? 'badge ongoing' : 'badge';
    return (
      '<div class="job-card" data-record-id="' + escapeHtml(j.recordId) + '">' +
        '<div class="info">' +
          '<b>' + escapeHtml(j.clientName || 'Unknown client') + '</b>' +
          '<div class="line">' + escapeHtml(j.address || '') + '</div>' +
          '<div class="line">' + escapeHtml(j.propertyType || '') + (j.service ? ' &middot; ' + escapeHtml(j.service) : '') + '</div>' +
          '<div class="line">' + escapeHtml(j.bookedDisplay || 'Not yet scheduled') + '</div>' +
          '<div class="line">' + escapeHtml(j.phone || '') + '</div>' +
          '<span class="' + badgeClass + '">' + escapeHtml(j.status) + '</span>' +
        '</div>' +
        '<button class="complete" data-order-id="' + escapeHtml(j.orderId) + '">Mark Completed</button>' +
      '</div>'
    );
  }).join('');
}

function fmtMoney(total) {
  return typeof total === 'number'
    ? total.toLocaleString('en-US', { style: 'currency', currency: 'USD' })
    : (total || 'N/A');
}

var PAYMENT_METHODS = ['Cash', 'Online / Card', 'Check', 'Bank Transfer'];

function renderUnpaid(jobs) {
  var list = $('unpaidList');
  if (!jobs.length) {
    list.innerHTML = '<div class="empty">Nothing outstanding &mdash; all completed jobs are paid up.</div>';
    return;
  }
  var methodOptions = PAYMENT_METHODS.map(function (m) {
    return '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>';
  }).join('');
  list.innerHTML = jobs.map(function (j) {
    return (
      '<div class="job-card" data-record-id="' + escapeHtml(j.recordId) + '">' +
        '<div class="info">' +
          '<b>' + escapeHtml(j.clientName || 'Unknown client') + '</b>' +
          '<div class="line">' + escapeHtml(j.address || '') + '</div>' +
          '<div class="line">' + escapeHtml(j.service || '') + '</div>' +
          '<div class="line">' + escapeHtml(j.phone || '') + '</div>' +
          '<div class="amount">' + escapeHtml(fmtMoney(j.total)) + ' due</div>' +
          '<span class="badge unpaid">Pending</span>' +
        '</div>' +
        '<div class="pay-controls">' +
          '<select class="method">' + methodOptions + '</select>' +
          '<button class="pay">Mark Paid</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
}

function loadJobs() {
  $('errorBox').innerHTML = '';
  $('countLabel').textContent = 'Loading&hellip;';
  fetch('/api/staff/jobs')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) throw new Error(data.error);
      renderJobs(data.jobs || []);
    })
    .catch(function (err) {
      $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
      $('countLabel').textContent = '';
    });

  fetch('/api/staff/unpaid')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) throw new Error(data.error);
      renderUnpaid(data.jobs || []);
    })
    .catch(function (err) {
      $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
    });
}

document.addEventListener('click', function (e) {
  if (e.target.classList.contains('complete')) {
    var btn = e.target;
    var card = btn.closest('.job-card');
    var recordId = card.getAttribute('data-record-id');
    var clientName = card.querySelector('b') ? card.querySelector('b').textContent : 'Client';
    var confirmed = window.confirm(
      'Mark ' + clientName + '’s job as completed?\n\nThis will send them a billing statement email right away.'
    );
    if (!confirmed) return;
    btn.disabled = true;
    btn.textContent = 'Marking...';
    $('errorBox').innerHTML = '';
    fetch('/api/staff/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId: recordId })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        $('toastBox').innerHTML = '<div class="toast">' + escapeHtml(clientName) + ' marked completed' +
          (data.emailSent ? ' — billing statement emailed.' : ' — no email on file, statement not sent.') + '</div>';
        card.remove();
        loadJobs();
      })
      .catch(function (err) {
        $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
        btn.disabled = false;
        btn.textContent = 'Mark Completed';
      });
    return;
  }

  if (e.target.classList.contains('pay')) {
    var payBtn = e.target;
    var payCard = payBtn.closest('.job-card');
    var payRecordId = payCard.getAttribute('data-record-id');
    var payClientName = payCard.querySelector('b') ? payCard.querySelector('b').textContent : 'Client';
    var methodSelect = payCard.querySelector('.method');
    var method = methodSelect ? methodSelect.value : '';
    var payConfirmed = window.confirm(
      'Mark ' + payClientName + '’s job as paid via ' + method + '?'
    );
    if (!payConfirmed) return;
    payBtn.disabled = true;
    methodSelect.disabled = true;
    payBtn.textContent = 'Marking...';
    $('errorBox').innerHTML = '';
    fetch('/api/staff/mark-paid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId: payRecordId, method: method })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        $('toastBox').innerHTML = '<div class="toast">' + escapeHtml(payClientName) + ' marked as paid (' + escapeHtml(method) + ')' +
          (data.transactionId ? ' — Transaction ID: ' + escapeHtml(data.transactionId) : '') + '.</div>';
        payCard.remove();
      })
      .catch(function (err) {
        $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
        payBtn.disabled = false;
        methodSelect.disabled = false;
        payBtn.textContent = 'Mark Paid';
      });
  }
});

$('refreshBtn').addEventListener('click', loadJobs);
loadJobs();
</script>
</body>
</html>
