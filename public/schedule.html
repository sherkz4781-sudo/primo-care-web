<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primo Care - Client Schedule</title>
<script>
(function(){
  try {
    var saved = localStorage.getItem('primo-theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --teal: #0e7c86;
    --teal-dark: #0a5c64;
    --teal-light: #e6f4f5;
    --teal-text: #0a5c64;
    --ink: #1f2937;
    --muted: #6b7280;
    --border: #e2e8f0;
    --bg: #eef1f2;
    --bg-page: #eef1f2;
    --yellow: #f5c518;
    --yellow-dark: #d9a900;
    --green: #16a34a;
    --red: #dc2626;
    --neu-dark: rgba(163, 177, 194, 0.55);
    --neu-light: rgba(255, 255, 255, 0.85);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --teal: #14a3ae;
    --teal-dark: #0a5c64;
    --teal-light: #123338;
    --teal-text: #52dbe0;
    --ink: #e9edee;
    --muted: #99a7aa;
    --border: #243033;
    --bg: #172124;
    --bg-page: #172124;
    --yellow: #f5c518;
    --yellow-dark: #d9a900;
    --green: #22c55e;
    --neu-dark: rgba(0, 0, 0, 0.55);
    --neu-light: rgba(255, 255, 255, 0.045);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }

  .topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 2px 0; margin-bottom: 22px;
    animation: drop-down-in 2.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .brand-mark {
    display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px;
    color: var(--teal-text); text-decoration: none;
  }
  .brand-mark .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  .page-heading { margin-bottom: 22px; }
  .page-heading h1 { font-family: var(--font-display); font-weight: 700; margin: 0 0 4px; font-size: 20px; color: var(--ink); }
  .page-heading p { margin: 0; font-size: 13px; color: var(--muted); }
  @keyframes drop-down-in {
    from { opacity: 0; transform: translateY(-50px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes text-drop-in {
    from { opacity: 0; transform: translateY(-26px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page-heading h1, .page-heading p {
    animation: text-drop-in 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .page-heading h1 { animation-delay: 0.8s; }
  .page-heading p { animation-delay: 1.3s; }
  @media (prefers-reduced-motion: reduce) {
    .topnav, .page-heading h1, .page-heading p, .job-card, .cal-card { animation: none; opacity: 1; transform: none; }
  }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .toolbar .count { font-size: 13px; color: var(--muted); }
  button.refresh {
    background: var(--bg); border: none; color: var(--teal-text); font-weight: 700;
    font-size: 12.5px; padding: 7px 14px; border-radius: 10px; cursor: pointer;
    box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  button.refresh:hover { box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  button.refresh:active { box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light); }

  .job-card {
    background: var(--bg); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 12px; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start;
    box-shadow: 7px 7px 14px var(--neu-dark), -7px -7px 14px var(--neu-light);
    animation: drop-down-in 2.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    animation-delay: 0.3s;
  }
  @media (max-width: 560px) {
    .job-card { flex-direction: column; align-items: stretch; }
    .pay-controls { flex-direction: row; }
    .pay-controls select.method { flex: 1; }
    .topnav { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
  .job-card .info b { display: block; font-size: 15px; margin-bottom: 4px; }
  .job-card .info .line { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .job-card .info .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; padding: 2px 8px; border-radius: 999px; margin-top: 6px;
    background: var(--teal-light); color: var(--teal-text);
  }
  .job-card .info .badge.ongoing { background: #fef3c7; color: #92400e; }
  .job-card .info .badge.unpaid { background: #ffedd5; color: #9a3412; }
  .job-card .info .amount { font-size: 14px; font-weight: 700; color: var(--teal-text); margin-top: 4px; }
  .job-card .info .client-says { font-size: 12px; color: var(--teal-text); margin-top: 6px; font-weight: 600; }
  .job-card .info .proof-link { display: inline-block; margin-top: 8px; }
  .job-card .info .proof-thumb {
    width: 72px; height: 72px; object-fit: cover; border-radius: 10px;
    box-shadow: 3px 3px 6px var(--neu-dark), -3px -3px 6px var(--neu-light);
    display: block; transition: transform 0.15s ease;
  }
  .job-card .info .proof-thumb:hover { transform: scale(1.05); }
  button.complete {
    background: var(--green); color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 13px; padding: 10px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  button.complete:hover { box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  button.complete:active { box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3); }
  button.complete:disabled { opacity: 0.6; cursor: default; }
  button.start-job {
    background: var(--teal); color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 13px; padding: 10px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  button.start-job:hover { box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  button.start-job:active { box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3); }
  button.start-job:disabled { opacity: 0.6; cursor: default; }
  .pay-controls { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  select.method {
    border: none; border-radius: 10px; font-size: 13px; padding: 9px 11px;
    color: var(--ink); background: var(--bg); font-family: inherit;
    box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
  }
  button.pay {
    background: #d97706; color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 13px; padding: 10px 16px; cursor: pointer; white-space: nowrap;
    box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  button.pay:hover { box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  button.pay:active { box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3); }
  button.pay:disabled { opacity: 0.6; cursor: default; }

  h2.section-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); margin: 30px 0 12px; }

  .cal-card {
    background: var(--bg); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 26px;
    box-shadow: 7px 7px 14px var(--neu-dark), -7px -7px 14px var(--neu-light);
    animation: drop-down-in 2.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    animation-delay: 0.3s;
  }
  .cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-toolbar .cal-nav { display: flex; align-items: center; gap: 8px; }
  button.cal-btn {
    background: var(--bg); border: none; color: var(--teal-text); font-weight: 700;
    font-size: 12.5px; padding: 6px 12px; border-radius: 9px; cursor: pointer;
    box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  button.cal-btn:hover { box-shadow: 2px 2px 5px var(--neu-dark), -2px -2px 5px var(--neu-light); }
  button.cal-btn:active { box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light); }
  .cal-label { font-weight: 800; font-size: 14.5px; color: var(--ink); min-width: 140px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding-bottom: 4px; }
  .cal-day {
    border-radius: 9px; min-height: 74px;
    padding: 5px 5px 3px; background: var(--bg);
    box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light);
  }
  .cal-day.other-month { opacity: 0.55; }
  .cal-day.other-month .cal-num { color: var(--muted); }
  .cal-day.today { box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light), 0 0 0 1.5px var(--teal); }
  .cal-num { font-size: 11.5px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .cal-chip {
    display: block; background: var(--teal-light); color: var(--teal-text); font-size: 10px;
    font-weight: 600; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-chip.recurring { background: #fef3c7; color: #92400e; }
  .cal-more { font-size: 9.5px; color: var(--muted); padding-left: 1px; }
  @media (max-width: 560px) {
    .cal-day { min-height: 58px; padding: 3px 3px 2px; }
    .cal-num { font-size: 10px; }
    .cal-chip { font-size: 8.5px; padding: 1px 3px; }
    .cal-dow { font-size: 9px; }
  }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; }
  .error-box {
    background: var(--bg); color: #991b1b; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 14px;
    box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light);
  }
  .toast {
    background: var(--bg); color: var(--green); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 14px;
    box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light);
  }
  .hidden { display: none !important; }

  button.logout-btn {
    background: var(--bg); color: var(--ink); border: none; font-weight: 700;
    font-size: 12px; padding: 8px 13px; border-radius: 10px; cursor: pointer; white-space: nowrap;
    box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  button.logout-btn:hover { box-shadow: 2px 2px 5px var(--neu-dark), -2px -2px 5px var(--neu-light); }

  .login-wrap { max-width: 360px; margin: 40px auto; }
  .login-card {
    background: var(--bg); border-radius: 20px;
    padding: 26px 24px;
    box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light);
  }
  .login-card h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0 0 18px; text-align: center; color: var(--ink); }
  .login-card .field { margin-bottom: 14px; }
  .login-card label { font-size: 13px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 5px; }
  .login-card input[type=text], .login-card input[type=password] {
    width: 100%; padding: 9px 11px; border: none; border-radius: 10px;
    font-size: 14px; color: var(--ink); background: var(--bg); font-family: inherit;
    box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
  }
  .login-card input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  button.login-submit {
    width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 12px;
    font-weight: 700; font-size: 14px; padding: 11px 16px; cursor: pointer; margin-top: 4px;
    box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  button.login-submit:hover { box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  button.login-submit:active { box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3); }
  button.login-submit:disabled { opacity: 0.6; cursor: default; }

  .theme-toggle {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--bg); color: var(--teal-text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light);
    transition: box-shadow 0.15s ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover { box-shadow: 2px 2px 5px var(--neu-dark), -2px -2px 5px var(--neu-light); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topnav">
    <a class="brand-mark" href="/">
      <span class="logo">&#10003;</span> Primo Care
    </a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
      <button class="logout-btn hidden" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="page-heading">
    <h1>Primo Care &mdash; Client Schedule</h1>
    <p>Mark completed jobs off the schedule, and mark payments once settled</p>
  </div>

  <div id="loginWrap" class="login-wrap hidden">
    <div class="login-card">
      <h2>Log In</h2>
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUsername" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <div id="loginError" class="error-box hidden"></div>
      <button class="login-submit" id="loginBtn">Log In</button>
    </div>
  </div>

  <div id="mainContent" class="hidden">
    <div id="errorBox"></div>
    <div id="toastBox"></div>

    <h2 class="section-title" style="margin-top:0;">Schedule</h2>
    <div class="cal-card">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="cal-btn" id="calPrev">&larr;</button>
          <button class="cal-btn" id="calToday">Today</button>
          <button class="cal-btn" id="calNext">&rarr;</button>
        </div>
        <div class="cal-label" id="calLabel">&nbsp;</div>
        <div style="width:1px;"></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="toolbar">
      <span class="count" id="countLabel">Loading&hellip;</span>
      <button class="refresh" id="refreshBtn">Refresh</button>
    </div>

    <div id="jobList"></div>

    <h2 class="section-title">Awaiting Payment</h2>
    <div id="unpaidList"></div>
  </div>
</div>

<script>
function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderJobs(jobs) {
  var list = $('jobList');
  if (!jobs.length) {
    list.innerHTML = '<div class="empty">No scheduled or ongoing jobs right now.</div>';
    $('countLabel').textContent = '0 jobs';
    return;
  }
  $('countLabel').textContent = jobs.length + ' job' + (jobs.length === 1 ? '' : 's');
  list.innerHTML = jobs.map(function (j) {
    var badgeClass = j.status === 'Ongoing' ? 'badge ongoing' : 'badge';
    var actionBtn = j.hasBeforePhoto
      ? '<button class="complete">Mark Completed</button>'
      : '<button class="start-job">Start Job (Before Photo)</button>';
    return (
      '<div class="job-card" data-record-id="' + escapeHtml(j.recordId) + '">' +
        '<div class="info">' +
          '<b>' + escapeHtml(j.clientName || 'Unknown client') + '</b>' +
          '<div class="line">' + escapeHtml(j.address || '') + '</div>' +
          '<div class="line">' + escapeHtml(j.propertyType || '') + (j.service ? ' &middot; ' + escapeHtml(j.service) : '') + '</div>' +
          '<div class="line">' + escapeHtml(j.bookedDisplay || 'Not yet scheduled') + '</div>' +
          '<div class="line">' + escapeHtml(j.phone || '') + '</div>' +
          '<span class="' + badgeClass + '">' + escapeHtml(j.status) + '</span>' +
          (j.hasBeforePhoto ? '<div class="line" style="color:var(--green);font-weight:600;">&#10003; Before photo added</div>' : '') +
        '</div>' +
        actionBtn +
      '</div>'
    );
  }).join('');
}

// Opens the device's file/camera picker, and on selection POSTs it as multipart/form-data to
// `url` alongside recordId. Shared by the Start Job (before photo) and Mark Completed (after
// photo) actions below — same upload shape, different endpoint/field name.
function pickPhotoAndUpload(url, recordId, onDone) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    document.body.removeChild(input);
    if (!file) { onDone(new Error('cancelled')); return; }
    var formData = new FormData();
    formData.append('recordId', recordId);
    formData.append('photo', file);
    fetch(url, { method: 'POST', body: formData })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        onDone(null, data);
      })
      .catch(function (err) { onDone(err); });
  });
  input.click();
}

function fmtMoney(total) {
  return typeof total === 'number'
    ? total.toLocaleString('en-US', { style: 'currency', currency: 'USD' })
    : (total || 'N/A');
}

var PAYMENT_METHODS = ['Cash', 'Online / Card', 'Check', 'Bank Transfer'];

function renderUnpaid(jobs) {
  var list = $('unpaidList');
  if (!jobs.length) {
    list.innerHTML = '<div class="empty">Nothing outstanding &mdash; all completed jobs are paid up.</div>';
    return;
  }
  list.innerHTML = jobs.map(function (j) {
    var methodOptions = PAYMENT_METHODS.map(function (m) {
      var selected = m === j.clientSelectedMethod ? ' selected' : '';
      return '<option value="' + escapeHtml(m) + '"' + selected + '>' + escapeHtml(m) + '</option>';
    }).join('');
    var clientSays = j.clientSelectedMethod
      ? '<div class="client-says">Client says: ' + escapeHtml(j.clientSelectedMethod) + '</div>'
      : '';
    var proof = j.proofUrl
      ? '<a class="proof-link" href="' + escapeHtml(j.proofFullUrl || j.proofUrl) + '" target="_blank" rel="noopener">' +
        '<img class="proof-thumb" src="' + escapeHtml(j.proofUrl) + '" alt="Transfer proof"></a>'
      : '';
    return (
      '<div class="job-card" data-record-id="' + escapeHtml(j.recordId) + '">' +
        '<div class="info">' +
          '<b>' + escapeHtml(j.clientName || 'Unknown client') + '</b>' +
          '<div class="line">' + escapeHtml(j.address || '') + '</div>' +
          '<div class="line">' + escapeHtml(j.service || '') + '</div>' +
          '<div class="line">' + escapeHtml(j.phone || '') + '</div>' +
          '<div class="amount">' + escapeHtml(fmtMoney(j.total)) + ' due</div>' +
          '<span class="badge unpaid">Pending</span>' +
          clientSays +
          proof +
        '</div>' +
        '<div class="pay-controls">' +
          '<select class="method">' + methodOptions + '</select>' +
          '<button class="pay">Mark Paid</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
}

function loadJobs() {
  $('errorBox').innerHTML = '';
  $('countLabel').textContent = 'Loading&hellip;';
  fetch('/api/staff/jobs')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) throw new Error(data.error);
      renderJobs(data.jobs || []);
    })
    .catch(function (err) {
      $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
      $('countLabel').textContent = '';
    });

  fetch('/api/staff/unpaid')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) throw new Error(data.error);
      renderUnpaid(data.jobs || []);
    })
    .catch(function (err) {
      $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
    });
}

document.addEventListener('click', function (e) {
  if (e.target.classList.contains('start-job')) {
    var startBtn = e.target;
    var startCard = startBtn.closest('.job-card');
    var startRecordId = startCard.getAttribute('data-record-id');
    var startClientName = startCard.querySelector('b') ? startCard.querySelector('b').textContent : 'Client';
    $('errorBox').innerHTML = '';
    startBtn.disabled = true;
    startBtn.textContent = 'Uploading...';
    pickPhotoAndUpload('/api/staff/start-job', startRecordId, function (err) {
      if (err) {
        startBtn.disabled = false;
        startBtn.textContent = 'Start Job (Before Photo)';
        if (err.message !== 'cancelled') {
          $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
        }
        return;
      }
      $('toastBox').innerHTML = '<div class="toast">' + escapeHtml(startClientName) + ' — before photo added.</div>';
      loadJobs();
    });
    return;
  }

  if (e.target.classList.contains('complete')) {
    var btn = e.target;
    var card = btn.closest('.job-card');
    var recordId = card.getAttribute('data-record-id');
    var clientName = card.querySelector('b') ? card.querySelector('b').textContent : 'Client';
    var confirmed = window.confirm(
      'Mark ' + clientName + '’s job as completed?\n\nYou\'ll be asked for an after photo next, then this sends them a billing statement email right away.'
    );
    if (!confirmed) return;
    $('errorBox').innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Uploading...';
    pickPhotoAndUpload('/api/staff/complete', recordId, function (err, data) {
      if (err) {
        btn.disabled = false;
        btn.textContent = 'Mark Completed';
        if (err.message !== 'cancelled') {
          $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
        }
        return;
      }
      $('toastBox').innerHTML = '<div class="toast">' + escapeHtml(clientName) + ' marked completed' +
        (data.emailSent ? ' — billing statement emailed.' : ' — no email on file, statement not sent.') +
        (data.referralCreditAwarded ? ' A $10 referral credit was just earned by whoever referred them.' : '') + '</div>';
      card.remove();
      loadJobs();
    });
    return;
  }

  if (e.target.classList.contains('pay')) {
    var payBtn = e.target;
    var payCard = payBtn.closest('.job-card');
    var payRecordId = payCard.getAttribute('data-record-id');
    var payClientName = payCard.querySelector('b') ? payCard.querySelector('b').textContent : 'Client';
    var methodSelect = payCard.querySelector('.method');
    var method = methodSelect ? methodSelect.value : '';
    var payConfirmed = window.confirm(
      'Mark ' + payClientName + '’s job as paid via ' + method + '?'
    );
    if (!payConfirmed) return;
    payBtn.disabled = true;
    methodSelect.disabled = true;
    payBtn.textContent = 'Marking...';
    $('errorBox').innerHTML = '';
    fetch('/api/staff/mark-paid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId: payRecordId, method: method })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        $('toastBox').innerHTML = '<div class="toast">' + escapeHtml(payClientName) + ' marked as paid (' + escapeHtml(method) + ')' +
          (data.transactionId ? ' — Transaction ID: ' + escapeHtml(data.transactionId) : '') + '.</div>';
        payCard.remove();
      })
      .catch(function (err) {
        $('errorBox').innerHTML = '<div class="error-box">' + escapeHtml(err.message) + '</div>';
        payBtn.disabled = false;
        methodSelect.disabled = false;
        payBtn.textContent = 'Mark Paid';
      });
  }
});

// ---- Schedule calendar ----
var calState = { year: 0, month: 0 };

function calSetToday() {
  var now = new Date();
  calState.year = now.getFullYear();
  calState.month = now.getMonth() + 1;
}

function calMonthLabel(y, m) {
  return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function renderCalendar(events) {
  var y = calState.year, m = calState.month;
  var firstOfMonth = new Date(y, m - 1, 1);
  var startWeekday = firstOfMonth.getDay();
  var daysInMonth = new Date(y, m, 0).getDate();
  var daysInPrevMonth = new Date(y, m - 1, 0).getDate();
  var todayStr = new Date().toDateString();

  var byDay = {};
  events.forEach(function (ev) {
    if (!ev.start) return;
    var d = new Date(ev.start);
    var key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    (byDay[key] = byDay[key] || []).push(ev);
  });

  var dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var cells = dow.map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');

  var totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  for (var i = 0; i < totalCells; i++) {
    var dayNum, cellMonth, cellYear, isOther = false;
    if (i < startWeekday) {
      dayNum = daysInPrevMonth - startWeekday + 1 + i;
      cellMonth = m - 1 < 1 ? 12 : m - 1;
      cellYear = m - 1 < 1 ? y - 1 : y;
      isOther = true;
    } else if (i >= startWeekday + daysInMonth) {
      dayNum = i - (startWeekday + daysInMonth) + 1;
      cellMonth = m + 1 > 12 ? 1 : m + 1;
      cellYear = m + 1 > 12 ? y + 1 : y;
      isOther = true;
    } else {
      dayNum = i - startWeekday + 1;
      cellMonth = m;
      cellYear = y;
    }
    var key = cellYear + '-' + cellMonth + '-' + dayNum;
    var dayEvents = byDay[key] || [];
    var isToday = new Date(cellYear, cellMonth - 1, dayNum).toDateString() === todayStr;

    var chips = dayEvents.slice(0, 3).map(function (ev) {
      var timeLabel = '';
      if (ev.start && ev.start.indexOf('T') !== -1) {
        timeLabel = new Date(ev.start).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' ';
      }
      var cls = /Primo Care Cleaning/.test(ev.title) ? 'recurring' : '';
      var label = ev.title.replace(/^Primo Care (Cleaning \([^)]+\)|Call) — /, '');
      return '<span class="cal-chip ' + cls + '" title="' + escapeHtml(ev.title) + '">' + escapeHtml(timeLabel + label) + '</span>';
    }).join('');
    var more = dayEvents.length > 3 ? '<div class="cal-more">+' + (dayEvents.length - 3) + ' more</div>' : '';

    cells += '<div class="cal-day' + (isOther ? ' other-month' : '') + (isToday ? ' today' : '') + '">'
      + '<div class="cal-num">' + dayNum + '</div>' + chips + more
      + '</div>';
  }
  $('calGrid').innerHTML = cells;
}

function loadCalendar() {
  $('calLabel').textContent = calMonthLabel(calState.year, calState.month);
  $('calGrid').innerHTML = '<div class="empty" style="grid-column:1/-1;">Loading&hellip;</div>';
  fetch('/api/staff/calendar?year=' + calState.year + '&month=' + calState.month)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) throw new Error(data.error);
      renderCalendar(data.events || []);
    })
    .catch(function (err) {
      $('calGrid').innerHTML = '<div class="error-box" style="grid-column:1/-1;">' + escapeHtml(err.message) + '</div>';
    });
}

$('calPrev').addEventListener('click', function () {
  calState.month--;
  if (calState.month < 1) { calState.month = 12; calState.year--; }
  loadCalendar();
});
$('calNext').addEventListener('click', function () {
  calState.month++;
  if (calState.month > 12) { calState.month = 1; calState.year++; }
  loadCalendar();
});
$('calToday').addEventListener('click', function () {
  calSetToday();
  loadCalendar();
});

$('refreshBtn').addEventListener('click', loadJobs);

// ---- Login gate ----
function showLoggedOut() {
  $('mainContent').classList.add('hidden');
  $('logoutBtn').classList.add('hidden');
  $('loginWrap').classList.remove('hidden');
}

function showLoggedIn() {
  $('loginWrap').classList.add('hidden');
  $('mainContent').classList.remove('hidden');
  $('logoutBtn').classList.remove('hidden');
  calSetToday();
  loadCalendar();
  loadJobs();
}

function checkAuth() {
  fetch('/api/whoami')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function () { showLoggedIn(); })
    .catch(function () { showLoggedOut(); });
}

function attemptLogin() {
  var username = $('loginUsername').value.trim();
  var password = $('loginPassword').value;
  if (!username || !password) return;
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Logging in…';
  $('loginError').classList.add('hidden');
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  })
    .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
    .then(function (res) {
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'Log In';
      if (!res.ok) {
        $('loginError').textContent = (res.data && res.data.error) || 'Login failed.';
        $('loginError').classList.remove('hidden');
        return;
      }
      $('loginPassword').value = '';
      showLoggedIn();
    })
    .catch(function () {
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'Log In';
      $('loginError').textContent = 'Something went wrong. Please try again.';
      $('loginError').classList.remove('hidden');
    });
}

$('loginBtn').addEventListener('click', attemptLogin);
$('loginPassword').addEventListener('keydown', function (e) { if (e.key === 'Enter') attemptLogin(); });
$('loginUsername').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginPassword').focus(); });

$('logoutBtn').addEventListener('click', function () {
  fetch('/api/logout', { method: 'POST' }).then(function () { showLoggedOut(); });
});

checkAuth();

(function() {
  var toggle = document.getElementById('themeToggle');
  if (!toggle) return;
  function current() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function reflect() {
    var dark = current() === 'dark';
    toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  reflect();
  toggle.addEventListener('click', function() {
    var next = current() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('primo-theme', next); } catch (e) {}
    reflect();
  });
})();
</script>
