<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primo Care - My Account</title>
<script>
(function(){
  try {
    var saved = localStorage.getItem('primo-theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --teal: #0e7c86;
    --teal-dark: #0a5c64;
    --teal-light: #e6f4f5;
    --teal-text: #0a5c64;
    --ink: #1f2937;
    --muted: #6b7280;
    --border: #e2e8f0;
    --bg: #ffffff;
    --bg-page: #f7f9fa;
    --green: #166534; --green-bg: #ecfdf3;
    --amber: #92400e; --amber-bg: #fffbeb;
    --red: #991b1b; --red-bg: #fef2f2;
    --gray: #4b5563; --gray-bg: #f3f4f6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --teal: #14a3ae;
    --teal-dark: #0a5c64;
    --teal-light: #123338;
    --teal-text: #52dbe0;
    --ink: #e9edee;
    --muted: #99a7aa;
    --border: #243033;
    --bg: #131b1e;
    --bg-page: #0a1214;
    --green: #4ade80; --green-bg: #0f2a1a;
    --amber: #fbbf24; --amber-bg: #2b2109;
    --red: #f87171; --red-bg: #2b1212;
    --gray: #9ca3af; --gray-bg: #1c2226;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }

  header.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 24px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    border-radius: 14px;
    color: white;
    margin-bottom: 24px;
    animation: drop-down-in 2.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  header.brand .logo {
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  header.brand h1 { font-family: var(--font-display); font-weight: 700; margin: 0; font-size: 21px; letter-spacing: 0.2px; }
  header.brand p { margin: 2px 0 0; font-size: 13px; opacity: 0.9; }
  @keyframes drop-down-in {
    from { opacity: 0; transform: translateY(-50px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-up-in {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    header.brand, .card { animation: none; opacity: 1; transform: none; }
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    animation: fade-up-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .card h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 4px; }
  .card .card-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; }

  .empty-note { color: var(--muted); font-size: 13.5px; padding: 6px 0; }

  .prop-item, .order-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; margin-bottom: 10px;
  }
  .prop-item:last-child, .order-item:last-child { margin-bottom: 0; }
  .prop-addr { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .prop-meta, .order-meta { font-size: 12.5px; color: var(--muted); }

  .prop-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .add-property-btn {
    background: var(--bg); color: var(--teal-text); border: 1.5px dashed var(--teal);
    border-radius: 9px; padding: 12px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
    width: 100%; margin-top: 12px; font-family: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .add-property-btn:hover { background: var(--teal-light); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }

  .rebook-btn {
    background: none; border: 1.5px solid var(--teal); color: var(--teal-text);
    border-radius: 7px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .rebook-btn:hover { background: var(--teal-light); transform: translateY(-1px); box-shadow: 0 5px 12px rgba(0,0,0,0.08); }

  .delete-btn {
    background: none; border: 1.5px solid var(--border); color: var(--red);
    border-radius: 7px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .delete-btn:hover { background: var(--red-bg); border-color: var(--red); transform: translateY(-1px); box-shadow: 0 5px 12px rgba(0,0,0,0.08); }
  .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .delete-btn:disabled:hover { transform: none; box-shadow: none; }

  .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 5px; }
  .order-id { font-size: 11px; color: var(--muted); font-family: monospace; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .badge.scheduled { background: var(--teal-light); color: var(--teal-text); }
  .badge.ongoing { background: var(--amber-bg); color: var(--amber); }
  .badge.completed { background: var(--green-bg); color: var(--green); }
  .badge.cancelled { background: var(--red-bg); color: var(--red); }
  .badge.rescheduled { background: var(--gray-bg); color: var(--gray); }

  .skeleton { color: var(--muted); font-size: 13.5px; padding: 6px 0; }

  .logout-link {
    margin-left: auto; color: rgba(255,255,255,0.85); font-size: 12.5px; font-weight: 600;
    text-decoration: none; background: rgba(255,255,255,0.14); padding: 7px 12px; border-radius: 8px;
    cursor: pointer; flex-shrink: 0; border: none; font-family: inherit;
  }
  .logout-link:hover { background: rgba(255,255,255,0.24); }

  .theme-toggle {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.18); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.25s ease, background 0.2s ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.3); transform: rotate(15deg); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  .footer-note { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="brand">
    <div class="logo">&#128100;</div>
    <div>
      <h1>My Account</h1>
      <p id="welcomeLine">Primo Care Cleaning Services</p>
    </div>
    <button class="logout-link" id="logoutBtn" type="button">Log Out</button>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </header>

  <div class="card" id="propertiesCard" style="display:none;">
    <h2>My Properties</h2>
    <p class="card-sub">Properties you've booked with us before.</p>
    <div id="propertiesList"><div class="skeleton">Loading&hellip;</div></div>
    <button class="add-property-btn" id="addPropertyBtn" type="button">+ Add a Property</button>
  </div>

  <div class="card" id="ordersCard" style="display:none;">
    <h2>Order History</h2>
    <p class="card-sub">Every booking you've made with Primo Care.</p>
    <div id="ordersList"><div class="skeleton">Loading&hellip;</div></div>
  </div>

  <div class="footer-note">Primo Care Cleaning Services</div>
</div>

<script>
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function badgeClass(status) {
    return String(status || '').toLowerCase().replace(/[^a-z]/g, '') || 'scheduled';
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function fmtMoney(n) {
    var num = Number(n) || 0;
    return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  var me = { email: '', fullName: '' };
  var loadedProperties = [];

  fetch('/api/client/whoami')
    .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
    .then(function(res) {
      if (!res.ok) {
        window.location.href = '/client/login';
        return;
      }
      me.email = res.data.email || '';
      me.fullName = res.data.fullName || '';
      $('welcomeLine').textContent = 'Welcome back, ' + (me.fullName || me.email) + '!';
      $('propertiesCard').style.display = 'block';
      $('ordersCard').style.display = 'block';
      loadProperties();
      loadOrders();
    })
    .catch(function() {
      window.location.href = '/client/login';
    });

  function loadProperties() {
    fetch('/api/client/properties')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        loadedProperties = data.properties || [];
        if (!loadedProperties.length) {
          $('propertiesList').innerHTML = '<div class="empty-note">No properties on file yet.</div>';
          return;
        }
        $('propertiesList').innerHTML = loadedProperties.map(function(p, i) {
          var meta = [p.propertyType, p.sqft ? (p.sqft + ' ' + (p.sizeUnit || 'sq ft')) : '', p.service].filter(Boolean).join(' &middot; ');
          return '<div class="prop-item"><div class="prop-addr">' + esc(p.address) + '</div><div class="prop-meta">' + meta + '</div>' +
            '<div class="prop-actions">' +
            '<button class="rebook-btn" data-i="' + i + '" type="button">Book This Property Again</button>' +
            '<button class="delete-btn" data-i="' + i + '" type="button">Delete</button>' +
            '</div></div>';
        }).join('');
        $('propertiesList').querySelectorAll('.rebook-btn').forEach(function(btn) {
          btn.addEventListener('click', function() { bookAgain(loadedProperties[parseInt(btn.getAttribute('data-i'), 10)]); });
        });
        $('propertiesList').querySelectorAll('.delete-btn').forEach(function(btn) {
          btn.addEventListener('click', function() { deleteProperty(loadedProperties[parseInt(btn.getAttribute('data-i'), 10)], btn); });
        });
      })
      .catch(function() {
        $('propertiesList').innerHTML = '<div class="empty-note">Couldn\'t load your properties. Please refresh.</div>';
      });
  }

  // Removes an address from this client's saved-properties list only — their actual booking
  // history under that address stays exactly as-is in Order History. Meant for e.g. a renter
  // who's moved out and doesn't want that old address cluttering their "book again" list; if
  // they ever book that address again, the server automatically un-hides it.
  function deleteProperty(p, btn) {
    if (!window.confirm('Remove ' + p.address + ' from your saved properties? Your past orders for this address will stay in your order history.')) return;
    btn.disabled = true;
    btn.textContent = 'Removing…';
    fetch('/api/client/properties/hide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: p.address })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) throw new Error(data.error || 'Failed to remove.');
        loadProperties();
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'Delete';
        alert('Couldn\'t remove this property. Please try again.');
      });
  }

  // Hands the chosen property + this client's info off to /intake via sessionStorage (same-tab
  // navigation only, cleared after one read) so it can pre-fill the first property card instead
  // of the client re-typing everything. Not a URL param: address/phone/pin have no business
  // sitting in a shareable URL or browser history.
  function bookAgain(p) {
    var nameParts = (me.fullName || '').trim().split(/\s+/);
    var payload = {
      firstName: nameParts[0] || '',
      lastName: nameParts.slice(1).join(' ') || '',
      phone: p.phone || '',
      email: me.email || '',
      property: {
        propertyType: (p.propertyType || '').toLowerCase() === 'commercial' ? 'commercial' : 'residential',
        address: p.address || '',
        zip: p.zip || '',
        sqft: p.sqft || '',
        sizeUnit: (p.sizeUnit || '').toLowerCase() === 'sq m' ? 'sqm' : 'sqft',
        service: p.service || '',
        mapPin: p.mapPin || ''
      }
    };
    try { sessionStorage.setItem('primo-account-handoff', JSON.stringify(payload)); } catch (e) {}
    window.location.href = '/intake?prefill=1';
  }

  // Same handoff as bookAgain, but with no `property` — /intake pre-fills this client's contact
  // info and leaves a blank property card, so adding a second (or third) address under one
  // account still skips re-typing the name/phone/email part.
  $('addPropertyBtn').addEventListener('click', function() {
    var nameParts = (me.fullName || '').trim().split(/\s+/);
    var payload = {
      firstName: nameParts[0] || '',
      lastName: nameParts.slice(1).join(' ') || '',
      phone: (loadedProperties[0] && loadedProperties[0].phone) || '',
      email: me.email || ''
    };
    try { sessionStorage.setItem('primo-account-handoff', JSON.stringify(payload)); } catch (e) {}
    window.location.href = '/intake?prefill=1';
  });

  function loadOrders() {
    fetch('/api/client/orders')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var orders = data.orders || [];
        if (!orders.length) {
          $('ordersList').innerHTML = '<div class="empty-note">No orders yet.</div>';
          return;
        }
        $('ordersList').innerHTML = orders.map(function(o) {
          var meta = [o.address, o.bookedDateTime || fmtDate(o.submittedAt)].filter(Boolean).join(' &middot; ');
          return '<div class="order-item">' +
            '<div class="order-top">' +
              '<div><span class="order-id">' + esc(o.orderId) + '</span></div>' +
              '<span class="badge ' + badgeClass(o.status) + '">' + esc(o.status || 'Scheduled') + '</span>' +
            '</div>' +
            '<div class="prop-addr" style="font-size:13.5px;">' + esc(o.service || 'Service') + '</div>' +
            '<div class="order-meta">' + meta + (o.total ? ' &middot; ' + fmtMoney(o.total) : '') + '</div>' +
          '</div>';
        }).join('');
      })
      .catch(function() {
        $('ordersList').innerHTML = '<div class="empty-note">Couldn\'t load your order history. Please refresh.</div>';
      });
  }

  $('logoutBtn').addEventListener('click', function() {
    fetch('/api/client/logout', { method: 'POST' }).finally(function() {
      window.location.href = '/client/login';
    });
  });

  (function() {
    var toggle = document.getElementById('themeToggle');
    if (!toggle) return;
    function current() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function reflect() {
      var dark = current() === 'dark';
      toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    reflect();
    toggle.addEventListener('click', function() {
      var next = current() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('primo-theme', next); } catch (e) {}
      reflect();
    });
  })();
</script>
</body>
</html>
