<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primo Care - My Account</title>
<script>
(function(){
  try {
    var saved = localStorage.getItem('primo-theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --teal: #0e7c86;
    --teal-dark: #0a5c64;
    --teal-light: #e6f4f5;
    --teal-text: #0a5c64;
    --ink: #1f2937;
    --muted: #6b7280;
    --border: #e2e8f0;
    --bg: #eef1f2;
    --bg-page: #eef1f2;
    --yellow: #f5c518;
    --yellow-dark: #d9a900;
    --green: #166534; --green-bg: #ecfdf3;
    --amber: #92400e; --amber-bg: #fffbeb;
    --red: #991b1b; --red-bg: #fef2f2;
    --gray: #4b5563; --gray-bg: #f3f4f6;
    /* Neumorphic elevation — every raised/pressed surface is cast in these two colors, on the
       exact same background as its container. Color differentiation (teal/red/etc.) lives in
       text and fill only, never in the shadow itself — real neumorphism reads as "one material,"
       and per-accent shadow tints break that illusion. */
    --neu-dark: rgba(163, 177, 194, 0.55);
    --neu-light: rgba(255, 255, 255, 0.85);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --teal: #14a3ae;
    --teal-dark: #0a5c64;
    --teal-light: #123338;
    --teal-text: #52dbe0;
    --ink: #e9edee;
    --muted: #99a7aa;
    --border: #243033;
    --bg: #172124;
    --bg-page: #172124;
    --yellow: #f5c518;
    --yellow-dark: #d9a900;
    --green: #4ade80; --green-bg: #0f2a1a;
    --amber: #fbbf24; --amber-bg: #2b2109;
    --red: #f87171; --red-bg: #2b1212;
    --gray: #9ca3af; --gray-bg: #1c2226;
    --neu-dark: rgba(0, 0, 0, 0.55);
    --neu-light: rgba(255, 255, 255, 0.045);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.35s ease, color 0.35s ease;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }

  /* Reusable elevation recipes */
  .neu-raised { box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); }
  .neu-raised-sm { box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light); }
  .neu-pressed { box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); }
  .neu-pressed-sm { box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light); }

  header.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 24px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    border-radius: 20px;
    color: white;
    margin-bottom: 24px;
    box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light);
    animation: drop-down-in 2.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  header.brand .logo {
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  header.brand h1 { font-family: var(--font-display); font-weight: 700; margin: 0; font-size: 21px; letter-spacing: 0.2px; }
  header.brand p { margin: 2px 0 0; font-size: 13px; opacity: 0.9; }
  @keyframes drop-down-in {
    from { opacity: 0; transform: translateY(-50px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-up-in {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    header.brand, .card { animation: none; opacity: 1; transform: none; }
  }

  .card {
    background: var(--bg);
    border-radius: 20px;
    padding: 20px 22px 22px;
    margin-bottom: 18px;
    box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light);
    animation: fade-up-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .card h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 4px; }
  .card .card-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; }

  .empty-note { color: var(--muted); font-size: 13.5px; padding: 6px 0; }

  .prop-item, .order-item {
    background: var(--bg); border-radius: 16px; padding: 13px 15px; margin-bottom: 12px;
    box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
  }
  .prop-item:last-child, .order-item:last-child { margin-bottom: 0; }
  .prop-addr { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .prop-meta, .order-meta { font-size: 12.5px; color: var(--muted); }

  .prop-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

  button { font-family: inherit; }

  .add-property-btn {
    background: var(--bg); color: var(--teal-text); border: none;
    border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
    width: 100%; margin-top: 12px;
    box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  .add-property-btn:hover { box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light); }
  .add-property-btn:active { box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); }

  .rebook-btn, .delete-btn, .manage-btn {
    background: var(--bg); border: none; border-radius: 12px; padding: 8px 14px;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
    box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  .rebook-btn:hover, .delete-btn:hover, .manage-btn:hover { box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  .rebook-btn:active, .delete-btn:active, .manage-btn:active { box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light); }
  .rebook-btn { color: var(--teal-text); }
  .delete-btn { color: var(--red); }
  .manage-btn { color: var(--ink); margin-top: 10px; }
  .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light); }

  .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 5px; }
  .order-id { font-size: 11px; color: var(--muted); font-family: monospace; }

  .manage-panel { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--neu-light); }
  .manage-panel.hidden { display: none; }

  .terms-box {
    background: var(--bg); border-radius: 12px;
    box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
    padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: var(--ink);
  }
  .terms-check {
    display: flex; align-items: flex-start; gap: 7px; margin-top: 8px;
    font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink);
  }
  .terms-check input { margin-top: 2px; }

  .choice-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .choice {
    border-radius: 12px; padding: 7px 12px;
    font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    background: var(--bg); user-select: none;
    box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light);
    transition: box-shadow 0.15s ease, color 0.15s ease;
  }
  .choice input { margin: 0; }
  .choice.active {
    color: var(--teal-text); font-weight: 600;
    box-shadow: inset 2px 2px 4px var(--neu-dark), inset -2px -2px 4px var(--neu-light);
  }

  .manage-panel textarea, .manage-panel input[type=date] {
    width: 100%; padding: 9px 11px; border: none; border-radius: 10px;
    font-size: 13px; color: var(--ink); background: var(--bg); font-family: inherit; resize: vertical;
    box-shadow: inset 2px 2px 5px var(--neu-dark), inset -2px -2px 5px var(--neu-light);
  }
  .manage-panel textarea:focus, .manage-panel input[type=date]:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .action-btn {
    margin-top: 8px; background: var(--teal); color: #fff; border: none; border-radius: 12px;
    padding: 9px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
    transition: box-shadow 0.15s ease;
  }
  .action-btn:hover { box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  .action-btn:active { box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3); }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .slot-btn {
    display: inline-block; padding: 7px 12px; margin: 3px 6px 0 0; border-radius: 10px;
    border: none; background: var(--bg); color: var(--teal-text);
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
    box-shadow: 3px 3px 6px var(--neu-dark), -3px -3px 6px var(--neu-light);
    transition: box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .slot-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .slot-btn.selected {
    background: var(--teal); color: #fff;
    box-shadow: inset 2px 2px 4px rgba(0,0,0,0.25);
  }

  .manage-result { margin-top: 10px; font-size: 12.5px; padding: 9px 11px; border-radius: 8px; }
  .manage-result.ok { background: var(--green-bg); color: var(--green); display: block; }
  .manage-result.err { background: var(--red-bg); color: var(--red); display: block; }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .badge.scheduled { background: var(--teal-light); color: var(--teal-text); }
  .badge.ongoing { background: var(--amber-bg); color: var(--amber); }
  .badge.completed { background: var(--green-bg); color: var(--green); }
  .badge.cancelled { background: var(--red-bg); color: var(--red); }
  .badge.rescheduled { background: var(--gray-bg); color: var(--gray); }

  .skeleton { color: var(--muted); font-size: 13.5px; padding: 6px 0; }

  .logout-link {
    margin-left: auto; color: rgba(255,255,255,0.85); font-size: 12.5px; font-weight: 600;
    text-decoration: none; background: rgba(255,255,255,0.14); padding: 7px 12px; border-radius: 8px;
    cursor: pointer; flex-shrink: 0; border: none; font-family: inherit;
  }
  .logout-link:hover { background: rgba(255,255,255,0.24); }

  .theme-toggle {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.18); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.25s ease, background 0.2s ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.3); transform: rotate(15deg); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  .footer-note { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="brand">
    <div class="logo">&#10003;</div>
    <div>
      <h1>My Account</h1>
      <p id="welcomeLine">Primo Care Cleaning Services</p>
    </div>
    <button class="logout-link" id="logoutBtn" type="button">Log Out</button>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </header>

  <div class="card" id="propertiesCard" style="display:none;">
    <h2>My Properties</h2>
    <p class="card-sub">Properties you've booked with us before.</p>
    <div id="propertiesList"><div class="skeleton">Loading&hellip;</div></div>
    <button class="add-property-btn" id="addPropertyBtn" type="button">+ Add a Property</button>
  </div>

  <div class="card" id="ordersCard" style="display:none;">
    <h2>Order History</h2>
    <p class="card-sub">Every booking you've made with Primo Care.</p>
    <div id="ordersList"><div class="skeleton">Loading&hellip;</div></div>
  </div>

  <div class="footer-note">Primo Care Cleaning Services</div>
</div>

<script>
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function badgeClass(status) {
    return String(status || '').toLowerCase().replace(/[^a-z]/g, '') || 'scheduled';
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function fmtMoney(n) {
    var num = Number(n) || 0;
    return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  var me = { email: '', fullName: '' };
  var loadedProperties = [];

  fetch('/api/client/whoami')
    .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
    .then(function(res) {
      if (!res.ok) {
        window.location.href = '/client/login';
        return;
      }
      me.email = res.data.email || '';
      me.fullName = res.data.fullName || '';
      $('welcomeLine').textContent = 'Welcome back, ' + (me.fullName || me.email) + '!';
      $('propertiesCard').style.display = 'block';
      $('ordersCard').style.display = 'block';
      loadProperties();
      loadOrders();
    })
    .catch(function() {
      window.location.href = '/client/login';
    });

  function loadProperties() {
    fetch('/api/client/properties')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        loadedProperties = data.properties || [];
        if (!loadedProperties.length) {
          $('propertiesList').innerHTML = '<div class="empty-note">No properties on file yet.</div>';
          return;
        }
        $('propertiesList').innerHTML = loadedProperties.map(function(p, i) {
          var meta = [p.propertyType, p.sqft ? (p.sqft + ' ' + (p.sizeUnit || 'sq ft')) : '', p.service].filter(Boolean).join(' &middot; ');
          return '<div class="prop-item"><div class="prop-addr">' + esc(p.address) + '</div><div class="prop-meta">' + meta + '</div>' +
            '<div class="prop-actions">' +
            '<button class="rebook-btn" data-i="' + i + '" type="button">Book This Property Again</button>' +
            '<button class="delete-btn" data-i="' + i + '" type="button">Delete</button>' +
            '</div></div>';
        }).join('');
        $('propertiesList').querySelectorAll('.rebook-btn').forEach(function(btn) {
          btn.addEventListener('click', function() { bookAgain(loadedProperties[parseInt(btn.getAttribute('data-i'), 10)]); });
        });
        $('propertiesList').querySelectorAll('.delete-btn').forEach(function(btn) {
          btn.addEventListener('click', function() { deleteProperty(loadedProperties[parseInt(btn.getAttribute('data-i'), 10)], btn); });
        });
      })
      .catch(function() {
        $('propertiesList').innerHTML = '<div class="empty-note">Couldn\'t load your properties. Please refresh.</div>';
      });
  }

  // Removes an address from this client's saved-properties list only — their actual booking
  // history under that address stays exactly as-is in Order History. Meant for e.g. a renter
  // who's moved out and doesn't want that old address cluttering their "book again" list; if
  // they ever book that address again, the server automatically un-hides it.
  function deleteProperty(p, btn) {
    if (!window.confirm('Remove ' + p.address + ' from your saved properties? Your past orders for this address will stay in your order history.')) return;
    btn.disabled = true;
    btn.textContent = 'Removing…';
    fetch('/api/client/properties/hide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: p.address })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) throw new Error(data.error || 'Failed to remove.');
        loadProperties();
      })
      .catch(function() {
        btn.disabled = false;
        btn.textContent = 'Delete';
        alert('Couldn\'t remove this property. Please try again.');
      });
  }

  // Hands the chosen property + this client's info off to /intake via sessionStorage (same-tab
  // navigation only, cleared after one read) so it can pre-fill the first property card instead
  // of the client re-typing everything. Not a URL param: address/phone/pin have no business
  // sitting in a shareable URL or browser history.
  function bookAgain(p) {
    var nameParts = (me.fullName || '').trim().split(/\s+/);
    var payload = {
      firstName: nameParts[0] || '',
      lastName: nameParts.slice(1).join(' ') || '',
      phone: p.phone || '',
      email: me.email || '',
      property: {
        propertyType: (p.propertyType || '').toLowerCase() === 'commercial' ? 'commercial' : 'residential',
        address: p.address || '',
        zip: p.zip || '',
        sqft: p.sqft || '',
        sizeUnit: (p.sizeUnit || '').toLowerCase() === 'sq m' ? 'sqm' : 'sqft',
        service: p.service || '',
        mapPin: p.mapPin || ''
      }
    };
    try { sessionStorage.setItem('primo-account-handoff', JSON.stringify(payload)); } catch (e) {}
    window.location.href = '/intake?prefill=1';
  }

  // Same handoff as bookAgain, but with no `property` — /intake pre-fills this client's contact
  // info and leaves a blank property card, so adding a second (or third) address under one
  // account still skips re-typing the name/phone/email part.
  $('addPropertyBtn').addEventListener('click', function() {
    var nameParts = (me.fullName || '').trim().split(/\s+/);
    var payload = {
      firstName: nameParts[0] || '',
      lastName: nameParts.slice(1).join(' ') || '',
      phone: (loadedProperties[0] && loadedProperties[0].phone) || '',
      email: me.email || ''
    };
    try { sessionStorage.setItem('primo-account-handoff', JSON.stringify(payload)); } catch (e) {}
    window.location.href = '/intake?prefill=1';
  });

  // Any booking that's still an active future visit can be cancelled/rescheduled — everything
  // except the two terminal states. Deliberately a deny-list rather than an allow-list of
  // "Scheduled"/"Ongoing": a booking that's already been rescheduled once is still just as
  // manageable as a freshly-scheduled one, it shouldn't lose the option after its first change.
  function isManageable(status) {
    return status !== 'Completed' && status !== 'Cancelled';
  }

  function loadOrders() {
    fetch('/api/client/orders')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var orders = data.orders || [];
        if (!orders.length) {
          $('ordersList').innerHTML = '<div class="empty-note">No orders yet.</div>';
          return;
        }
        $('ordersList').innerHTML = orders.map(function(o, i) {
          var meta = [o.address, o.bookedDateTime || fmtDate(o.submittedAt)].filter(Boolean).join(' &middot; ');
          var manageable = isManageable(o.status);
          return '<div class="order-item">' +
            '<div class="order-top">' +
              '<div><span class="order-id">' + esc(o.orderId) + '</span></div>' +
              '<span class="badge ' + badgeClass(o.status) + '">' + esc(o.status || 'Scheduled') + '</span>' +
            '</div>' +
            '<div class="prop-addr" style="font-size:13.5px;">' + esc(o.service || 'Service') + '</div>' +
            '<div class="order-meta">' + meta + (o.total ? ' &middot; ' + fmtMoney(o.total) : '') + '</div>' +
            (manageable ? manageBookingHtml(i) : '') +
          '</div>';
        }).join('');
        orders.forEach(function(o, i) {
          if (isManageable(o.status)) wireManagePanel(i, o.orderId);
        });
      })
      .catch(function() {
        $('ordersList').innerHTML = '<div class="empty-note">Couldn\'t load your order history. Please refresh.</div>';
      });
  }

  function manageBookingHtml(i) {
    return ''
      + '<button class="manage-btn" id="manageBtn_' + i + '" type="button">Manage Booking</button>'
      + '<div class="manage-panel hidden" id="managePanel_' + i + '">'
      + '<div class="terms-box">'
      + '<b>Cancellation &amp; Reschedule Policy</b>'
      + '<p style="margin:6px 0 0;">Changes made <b>less than 48 hours</b> before your scheduled time incur a fee of <b>20% of the Total Contract Price</b>. Changes made <b>48 hours or more</b> in advance are free.</p>'
      + '<label class="terms-check"><input type="checkbox" id="terms_' + i + '"><span>I agree to the Cancellation &amp; Reschedule Policy above.</span></label>'
      + '</div>'
      + '<div class="choice-row" id="actionChoices_' + i + '">'
      + '<label class="choice"><input type="radio" name="action_' + i + '" value="cancel"> Cancel</label>'
      + '<label class="choice"><input type="radio" name="action_' + i + '" value="reschedule"> Reschedule</label>'
      + '</div>'
      + '<div id="cancelBlock_' + i + '" class="hidden">'
      + '<textarea id="note_' + i + '" placeholder="Reason / note (optional)"></textarea>'
      + '<button class="action-btn" id="cancelBtn_' + i + '" type="button">Submit Cancellation</button>'
      + '</div>'
      + '<div id="rescheduleBlock_' + i + '" class="hidden">'
      + '<input type="date" id="date_' + i + '">'
      + '<button class="manage-btn" id="findTimesBtn_' + i + '" type="button" style="margin-top:8px;">Find Available Times</button>'
      + '<div id="slotsWrap_' + i + '" style="margin-top:8px;"></div>'
      + '<button class="action-btn hidden" id="submitRescheduleBtn_' + i + '" type="button">Submit Reschedule</button>'
      + '</div>'
      + '<div class="manage-result" id="manageResult_' + i + '" style="display:none;"></div>'
      + '</div>';
  }

  function fmtSlotTime(iso) {
    return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function wireManagePanel(i, orderId) {
    var panel = $('managePanel_' + i);
    $('manageBtn_' + i).addEventListener('click', function() {
      panel.classList.toggle('hidden');
    });

    panel.querySelectorAll('.choice input').forEach(function(inp) {
      inp.addEventListener('change', function() {
        panel.querySelectorAll('input[name="' + inp.name + '"]').forEach(function(r) {
          r.closest('.choice').classList.toggle('active', r.checked);
        });
        $('cancelBlock_' + i).classList.toggle('hidden', inp.value !== 'cancel');
        $('rescheduleBlock_' + i).classList.toggle('hidden', inp.value !== 'reschedule');
        $('manageResult_' + i).style.display = 'none';
      });
    });

    function showResult(msg, ok) {
      var box = $('manageResult_' + i);
      box.className = 'manage-result ' + (ok ? 'ok' : 'err');
      box.textContent = msg;
      box.style.display = 'block';
    }

    $('cancelBtn_' + i).addEventListener('click', function() {
      var btn = this;
      if (!$('terms_' + i).checked) {
        showResult('Please agree to the Cancellation & Reschedule Policy first.', false);
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Cancelling…';
      fetch('/api/client/cancel', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: orderId, note: $('note_' + i).value.trim() })
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) { showResult(data.error, false); btn.disabled = false; btn.textContent = 'Submit Cancellation'; return; }
          showResult('Your booking has been cancelled.', true);
          btn.disabled = true;
          loadOrders();
        })
        .catch(function() {
          showResult('Something went wrong. Please try again.', false);
          btn.disabled = false;
          btn.textContent = 'Submit Cancellation';
        });
    });

    var pendingSlots = [];
    var selectedIndex = -1;

    $('findTimesBtn_' + i).addEventListener('click', function() {
      var btn = this;
      var wrap = $('slotsWrap_' + i);
      wrap.innerHTML = '';
      $('submitRescheduleBtn_' + i).classList.add('hidden');
      pendingSlots = [];
      selectedIndex = -1;

      var dateVal = $('date_' + i).value;
      if (!dateVal) { showResult('Pick a new date first.', false); return; }

      btn.disabled = true;
      btn.textContent = 'Looking up available times…';
      fetch('/api/client/reschedule/find-times', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: orderId, date: dateVal })
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          btn.disabled = false;
          btn.textContent = 'Find Available Times';
          if (data.error) { showResult(data.error, false); return; }
          var slots = data.slots || [];
          if (!slots.length) { showResult('No open 30-minute slots that day during business hours (9am–5pm). Try another date.', false); return; }
          pendingSlots = slots;
          wrap.innerHTML = slots.map(function(s, si) {
            return '<button type="button" class="slot-btn" data-si="' + si + '">' + fmtSlotTime(s.start) + '</button>';
          }).join('');
          wrap.querySelectorAll('.slot-btn').forEach(function(b, si) {
            b.addEventListener('click', function() {
              wrap.querySelectorAll('.slot-btn').forEach(function(x) { x.classList.remove('selected'); });
              b.classList.add('selected');
              selectedIndex = si;
              $('submitRescheduleBtn_' + i).classList.remove('hidden');
              $('manageResult_' + i).style.display = 'none';
            });
          });
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Find Available Times';
          showResult('Something went wrong. Please try again.', false);
        });
    });

    $('submitRescheduleBtn_' + i).addEventListener('click', function() {
      var btn = this;
      if (selectedIndex < 0) { showResult('Please pick a time slot above first.', false); return; }
      if (!$('terms_' + i).checked) { showResult('Please agree to the Cancellation & Reschedule Policy first.', false); return; }

      var slot = pendingSlots[selectedIndex];
      btn.disabled = true;
      btn.textContent = 'Rescheduling…';
      fetch('/api/client/reschedule/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: orderId, slot: slot, note: $('note_' + i).value.trim() })
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) { showResult(data.error, false); btn.disabled = false; btn.textContent = 'Submit Reschedule'; return; }
          showResult('Rescheduled! ' + (data.isSubscription ? 'Your recurring ' + data.freqName + ' schedule now starts ' + data.startFormatted + '.' : 'Your new visit is booked for ' + data.startFormatted + '.'), true);
          loadOrders();
        })
        .catch(function() {
          showResult('Something went wrong. Please try again.', false);
          btn.disabled = false;
          btn.textContent = 'Submit Reschedule';
        });
    });
  }

  $('logoutBtn').addEventListener('click', function() {
    fetch('/api/client/logout', { method: 'POST' }).finally(function() {
      window.location.href = '/client/login';
    });
  });

  (function() {
    var toggle = document.getElementById('themeToggle');
    if (!toggle) return;
    function current() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function reflect() {
      var dark = current() === 'dark';
      toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    reflect();
    toggle.addEventListener('click', function() {
      var next = current() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('primo-theme', next); } catch (e) {}
      reflect();
    });
  })();
</script>
</body>
</html>
